<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="theme-color" content="#fff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>mObywatel 2.0</title>
    
    <script src="sw.js"></script>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preload" href="main.css" as="style">
    <link rel="stylesheet" href="main.css">
    <link href='https://fonts.googleapis.com/css?family=Inter:wght@300;400;500;600;700;900&display=swap' rel='stylesheet'>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="dowodnowy.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            overscroll-behavior: contain;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        .header-title {
            font-weight: 700;
            font-size: 20px;
            color: #000;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Styl dla zegara czasu rzeczywistego */
        .clock-container {
            text-align: center;
            font-size: 13px;
            color: #4b5563;
            margin-top: 14px;
            margin-bottom: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Główny kontener łączący kartę i status w jedną całość */
        .document-wrapper {
            margin: 12px 16px 12px 16px;
            border-radius: 28px;
            overflow: hidden; /* Odcina rogi dolnego paska, dopasowując do całości */
            box-shadow: 0 10px 30px rgba(160, 175, 190, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Główna karta mDowodu ze zdjęciem jako tłem */
        .mowod-card {
            padding: 24px 20px;
            
            /* TŁO Z PLIKU ZDJĘCIA */
            background-color: #e1f0fa;
            background-image: url('Screenshot_20260524-082007.ChatGPT.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex;
            gap: 22px;
            position: relative;
        }

        .card-left {
            width: 36%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .photo-container {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 24px;
            overflow: hidden;
            background: #cfd4dc;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .animated-flag {
            width: 56px;
            height: auto;
            margin-top: 16px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .emblem-section {
            display: flex;
            align-items: center;
            margin-top: 12px;
            gap: 6px;
            width: 100%;
            justify-content: flex-start;
            padding-left: 2px;
        }

        .emblem-section img {
            width: 24px;
            height: auto;
        }

        .emblem-text {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.1;
            color: #434955;
            letter-spacing: 0.1px;
        }

        .card-right {
            width: 64%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            justify-content: flex-start;
            padding-top: 2px;
        }

        .data-group {
            display: flex;
            flex-direction: column;
        }

        .data-value {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            line-height: 1.15;
        }

        .data-label {
            font-size: 11px;
            color: #6b7280;
            margin-top: 2px;
            font-weight: 400;
        }

        /* Połączony dolny pasek statusu */
        .status-container {
            background: #fff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #edf0f5; /* Delikatna linia odcięcia jak w oryginale */
        }

        .status-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0fdf4;
            flex-shrink: 0;
        }

        .status-text {
            font-weight: 600;
            font-size: 15px;
            color: #16a34a;
        }

        .menu-list {
            margin: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-radius: 18px;
            background-color: white;
            box-shadow: 0 4px 12px rgba(160, 175, 190, 0.05);
            border: 1px solid #edf0f5;
            text-decoration: none;
            color: inherit;
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-item-left img {
            width: 24px;
            height: 24px;
        }

        .menu-item-text {
            font-weight: 600;
            font-size: 15px;
            color: #1f2937;
        }

        .chevron-icon {
            color: #9ca3af;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .BottomNav_bottomNav__JQdpA {
            width: 100%;
            height: 85px;
            position: fixed;
            bottom: 0;
            background-color: #f8f9fc;
            border-top: 1px solid #e5e7eb;
            z-index: 999;
            display: flex;
            justify-content: space-around;
            align-items: center;
            left: 0;
        }

        .BottomNav_bnTab__WzkWH {
            width: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .BottomNav_bnTab__WzkWH img {
            height: 24px;
            margin-bottom: 4px;
        }

        .BottomNav_bnTab__WzkWH span {
            font-size: 10px;
            font-weight: 400;
            color: #6b7280;
        }

        .BottomNav_activeText__6iAIF {
            color: #1e40af !important;
            font-weight: 600 !important;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
